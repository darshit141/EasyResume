# IntelliResume Reverse Proxy Security Hardening (Nginx & Cloudflare)
# Whitelisting trusted third-party providers (Google Analytics, Google Ads, Google OAuth, Stripe)
# and blocking untrusted inline scripts and evaluation.

# ----------------------------------------------------------------------
# 1. NGINX CONFIGURATION SNIPPET
# Add inside your `server { ... }` or `location / { ... }` block:
# ----------------------------------------------------------------------

# Content Security Policy (Strict Production Profile)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://js.stripe.com; connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://api.stripe.com; frame-src 'self' https://accounts.google.com https://js.stripe.com https://googleads.g.doubleclick.net; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" always;

# Additional Defense-in-Depth Headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com')" always;

# ----------------------------------------------------------------------
# 2. CLOUDFLARE CONFIGURATION INSTRUCTIONS
# Cloudflare Dashboard -> Rules -> Transform Rules -> Modify Response Header:
# ----------------------------------------------------------------------
# Rule Name: Enforce IntelliResume CSP
# When incoming requests match: (http.host eq "yourdomain.com")
# Action: Set dynamic / static header:
#   Header name: Content-Security-Policy
#   Value: default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://js.stripe.com; connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://api.stripe.com; frame-src 'self' https://accounts.google.com https://js.stripe.com https://googleads.g.doubleclick.net; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;
