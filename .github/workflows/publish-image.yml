name: Publish Docker image

# Builds and publishes the backend image to GitHub Container Registry on
# every merge to main, once CI has already passed on that commit. This is
# the "build image" half of COMMERCIAL_READINESS_AUDIT.md P0-12's
# deployment pipeline — actually deploying that image (pulling it onto a
# server, running migrations against production, a post-deploy health
# check, and rollback-on-failure) is deliberately NOT wired here, because
# no hosting target is chosen yet (see DEPLOYMENT.md). Wire that in once
# one is.
on:
  push:
    branches: [main]

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        # Docker image names must be lowercase; a GitHub org/repo name may not be.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
